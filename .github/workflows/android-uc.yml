name: Build Vita3K+ UC

# Coexisting ("UC") Vita3K+ Android build.
# Baseline is now upstream Vita3K-Plus v1.4 (all-enhancements @ 5581fb11), i.e.
# every commit upstream shipped after the v1.3 tag (781a049). The UC patch set
# is what is left on top of it:
#   1. applicationId  org.vita3kplus.emulator -> org.vita3kplus.emulator.uc
#   2. accurate-thread-scheduling default      true -> false
#   3. high-accuracy default                   true -> false
#   4. app_name                                Vita3K+ -> Vita3K+ UC
# The Java package (namespace) deliberately stays org.vita3k.emulator because
# the native library binds its JNI symbols to it.
#
# v1.4 merge (seq 694) - upstream fixes taken wholesale, notably:
#   - Killzone: USSE g23/g24/g43 pixel+tile registers, buffer stores held to the
#     guest pixel centre, macrotiles submitted in Vita order (smoke/fog), FPS hack
#   - renderer: depth-buffer rework, fast-clear off for A6xx, texture-cache
#     thrashing and low-memory mode, double-buffer fixes
#   - shader: emulated vertex-shader memory stores (J-Stars / Epic Mickey on Mali)
#   - codec: AV_NOPTS_VALUE handling in h264
#   - upstream PRs: cheat database, home-screen game shortcuts, gamepad/camera
#
# fix1 (seq 692) - crash hardening taken from the Killzone field log:
#   5. SceGxm: reap display_host_thread in sceGxmTerminate and again before the
#      queue reset in sceGxmInitialize (reassigning a joinable std::thread is UB
#      and ends in "std::terminate called without an active exception"), and let
#      the display wait_sync loop observe display_queue.abort().
#   6. PipelineCache: never stack a second warm/worker thread batch on top of a
#      live one when init() runs again after a shader cache rebuild.
# Signing: ci/uc-signing.b64 holds the pinned keystore and its certificate digest
# is asserted below, so every build keeps one signature and installs over the
# previous release.

on:
  push:
    branches: [uc-build]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-uc:
    name: Android arm64 coexisting build
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - name: Checkout source (v1.3 + UC patches)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Show applied patches
        run: |
          echo "=== applicationId ==="
          grep -n 'applicationId = ' android/app/build.gradle
          echo "=== versionName ==="
          grep -n 'versionName = ' android/app/build.gradle
          echo "=== accurate-thread-scheduling ==="
          grep -n 'accurate-thread-scheduling' vita3k/config/include/config/config.h
          echo "=== high-accuracy ==="
          grep -n '"high-accuracy"' vita3k/config/include/config/config.h
          echo "=== app_name ==="
          grep -n 'name="app_name"' android/app/src/main/res/values/strings.xml

      - name: Restore native dependency cache
        uses: actions/cache@v5
        with:
          path: |
            /usr/local/share/vcpkg/installed
            /usr/local/share/vcpkg/packages
          key: cache-android-native-uc-${{ hashFiles('CMakeLists.txt', 'cmake/**', '.ci/**', 'android/app/build.gradle', 'vcpkg.json') }}
          restore-keys: |
            cache-android-native-uc-

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          add-job-summary: on-failure
          cache-provider: basic
          validate-wrappers: false

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4

      - name: Set up Android build environment
        env:
          VCPKG_ROOT: /usr/local/share/vcpkg
        run: bash ./.ci/setup-android.sh

      - uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: android-uc

      - name: Restore pinned signing keystore
        run: |
          set -euo pipefail
          base64 -d ci/uc-signing.b64 > "$RUNNER_TEMP/uc-release.jks"
          ls -la "$RUNNER_TEMP/uc-release.jks"
          keytool -list -v -keystore "$RUNNER_TEMP/uc-release.jks" \
            -storepass vita3kuc123 -alias vita3kuc | grep -E 'SHA256|Subject' | head -4

      - name: Build Android target (release)
        env:
          SIGNING_STORE_PATH: ${{ runner.temp }}/uc-release.jks
          SIGNING_STORE_PASSWORD: vita3kuc123
          SIGNING_KEY_ALIAS: vita3kuc
          SIGNING_KEY_PASSWORD: vita3kuc123
          VCPKG_ROOT: /usr/local/share/vcpkg
        run: bash ./.ci/build-android.sh "$GITHUB_WORKSPACE/artifacts/uc"

      - name: Verify APK identity and signature
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/artifacts/uc/app.apk"
          ls -la "$(dirname "$APK")"
          BT="$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)"
          echo "using $BT"
          "$BT/aapt2" dump badging "$APK" | head -3
          PKG="$("$BT/aapt2" dump badging "$APK" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -1)"
          VER="$("$BT/aapt2" dump badging "$APK" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -1)"
          ABIS="$("$BT/aapt2" dump badging "$APK" | sed -n "s/^native-code: //p" | head -1)"
          echo "package   = $PKG"
          echo "version   = $VER"
          echo "native    = $ABIS"
          if [ "$PKG" != "org.vita3kplus.emulator.uc" ]; then
            echo "::error::unexpected applicationId: $PKG — coexistence with stock Vita3K+ is broken"
            exit 1
          fi
          python3 ci/check_signature.py "$APK" || true
          echo "OK: $PKG installs alongside org.vita3kplus.emulator"

      - name: Assert the signing certificate did not change
        run: |
          set -euo pipefail
          python3 ci/check_signature.py artifacts/uc/app.apk 0112af32118e63044db3585b76137f4288261a0f6e1ce1d4d73d603981bf5301

      - name: Print ccache statistics
        if: always()
        run: ccache -s || true

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: vita3kplus-uc-arm64
          path: artifacts/uc
          if-no-files-found: error
          retention-days: 30
